name: Publish GitHub Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: |
          npm test
          npm run typecheck

      - name: Build Production Bundle
        run: npm run build

      - name: Package Standalone Distribution
        run: |
          cd dist
          zip -r ../aquasim-web-viewer-standalone.zip .
          cd ..

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: aquasim-web-viewer-standalone.zip
